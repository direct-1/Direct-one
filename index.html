<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a2e6e" />
  <title>دايركت | DIRECT</title>
  
  <!-- مكتبات التصميم والخطوط -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { blue: '#0a2e6e', lightBlue: '#1d4ed8', orange: '#f7931e', bg: '#f8fafc' }
          },
          fontFamily: { sans: ['Tajawal', 'sans-serif'] }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }
    .loader { border: 4px solid #f3f3f3; border-top: 4px solid #0a2e6e; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- شاشة التحميل -->
  <div id="loadingScreen" class="fixed inset-0 bg-brand-blue flex flex-col items-center justify-center z-50">
    <img src="logo.png" alt="Direct" class="w-32 mb-4 rounded-2xl bg-white p-2" onerror="this.style.display='none'">
    <div class="loader"></div>
  </div>

  <!-- شاشة تسجيل الدخول -->
  <div id="loginScreen" class="hidden min-h-screen items-center justify-center bg-brand-blue p-4">
    <div class="bg-white rounded-3xl shadow-xl w-full max-w-md p-8">
      <div class="text-center mb-8">
        <img src="logo.png" alt="Direct Logo" class="w-24 mx-auto mb-4 rounded-2xl" onerror="this.src='https://via.placeholder.com/100?text=Logo'">
        <h1 class="text-2xl font-bold text-brand-blue">مرحباً بك في دايركت</h1>
        <p class="text-gray-500 mt-1">طلبك يوصل مباشرة</p>
      </div>
      <div id="loginError" class="hidden bg-red-50 text-red-600 p-3 rounded-lg mb-4 text-sm text-center"></div>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-bold mb-1">البريد الإلكتروني</label>
          <input type="email" id="loginEmail" required dir="ltr" class="w-full border rounded-xl p-3 outline-none focus:ring-2 focus:ring-brand-blue" placeholder="admin@direct.com">
        </div>
        <div>
          <label class="block text-sm font-bold mb-1">كلمة المرور</label>
          <input type="password" id="loginPassword" required dir="ltr" class="w-full border rounded-xl p-3 outline-none focus:ring-2 focus:ring-brand-blue" placeholder="••••••••">
        </div>
        <button type="submit" class="w-full bg-brand-blue text-white font-bold py-3 rounded-xl hover:bg-brand-lightBlue transition flex items-center justify-center gap-2">
          تسجيل الدخول
        </button>
      </form>
      <div class="text-center mt-6 text-sm text-gray-600">
        ليس لديك حساب؟ <a href="#" onclick="toggleScreens('register')" class="text-brand-blue font-bold hover:underline">إنشاء حساب جديد</a>
      </div>
    </div>
  </div>

  <!-- شاشة إنشاء حساب -->
  <div id="registerScreen" class="hidden min-h-screen items-center justify-center bg-brand-blue p-4">
    <div class="bg-white rounded-3xl shadow-xl w-full max-w-md p-8">
      <div class="text-center mb-6">
        <img src="logo.png" alt="Direct Logo" class="w-20 mx-auto mb-3 rounded-xl" onerror="this.src='https://via.placeholder.com/100?text=Logo'">
        <h1 class="text-2xl font-bold text-brand-blue">إنشاء حساب</h1>
      </div>
      <div id="registerError" class="hidden bg-red-50 text-red-600 p-3 rounded-lg mb-4 text-sm text-center"></div>
      <form id="registerForm" class="space-y-4">
        <div>
          <label class="block text-sm font-bold mb-1">الاسم بالكامل</label>
          <input type="text" id="regName" required class="w-full border rounded-xl p-3 outline-none focus:ring-2 focus:ring-brand-blue" placeholder="اسمك الكريم">
        </div>
        <div>
          <label class="block text-sm font-bold mb-1">رقم الهاتف</label>
          <input type="tel" id="regPhone" required dir="ltr" class="w-full border rounded-xl p-3 outline-none focus:ring-2 focus:ring-brand-blue" placeholder="01xxxxxxxxx">
        </div>
        <div>
          <label class="block text-sm font-bold mb-1">البريد الإلكتروني</label>
          <input type="email" id="regEmail" required dir="ltr" class="w-full border rounded-xl p-3 outline-none focus:ring-2 focus:ring-brand-blue" placeholder="email@example.com">
        </div>
        <div>
          <label class="block text-sm font-bold mb-1">كلمة المرور</label>
          <input type="password" id="regPassword" required dir="ltr" class="w-full border rounded-xl p-3 outline-none focus:ring-2 focus:ring-brand-blue" placeholder="••••••••">
        </div>
        <button type="submit" class="w-full bg-brand-blue text-white font-bold py-3 rounded-xl hover:bg-brand-lightBlue transition flex items-center justify-center gap-2">
          إنشاء الحساب
        </button>
      </form>
      <div class="text-center mt-6 text-sm text-gray-600">
        لديك حساب بالفعل؟ <a href="#" onclick="toggleScreens('login')" class="text-brand-blue font-bold hover:underline">تسجيل الدخول</a>
      </div>
    </div>
  </div>

  <!-- واجهة التطبيق (الرئيسية) -->
  <div id="appScreen" class="hidden min-h-screen pb-20 bg-brand-bg">
    <header class="bg-brand-blue text-white p-4 rounded-b-3xl shadow-md sticky top-0 z-50">
      <div class="flex justify-between items-center max-w-2xl mx-auto">
        <div class="flex items-center gap-2">
          <img src="logo.png" alt="Logo" class="w-10 h-10 bg-white rounded-lg p-1" onerror="this.style.display='none'">
          <span class="font-bold text-xl">دايركت</span>
        </div>
        <button class="p-2 bg-white/10 rounded-full relative">
          🔔
        </button>
      </div>
    </header>

    <main class="max-w-2xl mx-auto p-4 space-y-6">
      <!-- صورة الغلاف -->
      <div class="relative rounded-2xl overflow-hidden shadow-lg bg-white">
        <img src="hero-banner.jpg" alt="Direct Features" class="w-full h-auto object-cover" onerror="this.src='https://via.placeholder.com/600x300/0a2e6e/ffffff?text=Direct+Banner'">
      </div>

      <div class="flex justify-between items-end">
        <div>
          <h2 class="text-xl font-bold text-brand-blue">أهلاً <span id="welcomeName">بك</span> 👋</h2>
          <p class="text-gray-500 text-sm">ماذا تحتاج اليوم؟</p>
        </div>
        <button id="logoutBtn" class="text-sm text-red-500 font-bold hover:underline">خروج</button>
      </div>

      <div class="bg-white p-4 rounded-2xl shadow-sm">
        <h3 class="font-bold text-brand-blue mb-3">الأقسام</h3>
        <div class="text-center text-gray-400 py-6 text-sm">سيتم عرض الأقسام هنا في المرحلة القادمة</div>
      </div>
    </main>

    <!-- شريط التنقل السفلي -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t shadow-[0_-4px_10px_rgba(0,0,0,0.05)] z-50">
      <div class="flex justify-around items-center max-w-2xl mx-auto py-3 text-gray-500">
        <a href="#" class="flex flex-col items-center text-brand-blue">
          <span class="text-2xl">🏠</span>
          <span class="text-xs font-bold mt-1">الرئيسية</span>
        </a>
        <a href="#" class="flex flex-col items-center hover:text-brand-blue">
          <span class="text-2xl">🛒</span>
          <span class="text-xs mt-1">السلة</span>
        </a>
        <a href="#" class="flex flex-col items-center hover:text-brand-blue">
          <span class="text-2xl">📋</span>
          <span class="text-xs mt-1">طلباتي</span>
        </a>
        <a href="#" class="flex flex-col items-center hover:text-brand-blue">
          <span class="text-2xl">👤</span>
          <span class="text-xs mt-1">حسابي</span>
        </a>
      </div>
    </nav>
  </div>

  <!-- سكربت Firebase (الربط بقاعدة البيانات) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    // ⚠️ دي مفاتيح مشروعك اللي أنت عملته قبل كده، مش محتاج تغيرها
    const firebaseConfig = {
      apiKey: "AIzaSyAUn6EhDFqef6I81EhNTZTB-qZRQHl7a1Q",
      authDomain: "direct-1-c93b9.firebaseapp.com",
      projectId: "direct-1-c93b9",
      storageBucket: "direct-1-c93b9.firebasestorage.app",
      messagingSenderId: "216801978683",
      appId: "1:216801978683:web:1c00ec158a1e190a2baf1e"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // دالة تبديل الشاشات
    window.toggleScreens = (screenName) => {
      document.querySelectorAll('#loadingScreen, #loginScreen, #registerScreen, #appScreen').forEach(s => s.classList.add('hidden'));
      const target = document.getElementById(screenName + 'Screen');
      if (target) {
        target.classList.remove('hidden');
        if(screenName !== 'loading') target.classList.add('flex');
      }
    };

    // دالة إظهار الأخطاء
    window.showError = (id, msg) => {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 4000);
    };

    // التحقق من حالة الدخول
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        try {
          const docRef = doc(db, "users", user.uid);
          const docSnap = await getDoc(docRef);
          if (docSnap.exists()) {
            const firstName = docSnap.data().name.split(' ')[0];
            document.getElementById('welcomeName').textContent = firstName;
          }
          toggleScreens('app');
        } catch (e) {
          console.error(e);
          toggleScreens('app');
        }
      } else {
        toggleScreens('login');
      }
    });

    // تسجيل الدخول
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        showError('loginError', 'بيانات الدخول غير صحيحة');
      }
    });

    // إنشاء حساب
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('regName').value;
      const phone = document.getElementById('regPhone').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        await setDoc(doc(db, "users", userCredential.user.uid), {
          name: name,
          phone: phone,
          email: email,
          role: 'customer',
          address: '',
          village: 'داخل القرية',
          createdAt: new Date()
        });
      } catch (err) {
        if(err.code === 'auth/email-already-in-use') {
          showError('registerError', 'هذا البريد مسجل بالفعل');
        } else {
          showError('registerError', 'حدث خطأ: ' + err.message);
        }
      }
    });

    // تسجيل الخروج
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await signOut(auth);
    });

  </script>
</body>
</html>
